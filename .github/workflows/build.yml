name: Build and deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4

            - name: Prepare environment
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install deps
              run: npm install

            - name: Build plugin(s)
              run: node ./build.mjs

            - name: Copy additional files
              run: |
                  cp README.md dist/README.md
                  touch dist/.nojekyll
                  cat > dist/404.html <<'HTML'
                  <!doctype html>
                  <meta charset="utf-8">
                  <title>404</title>
                  <p>You opened a link that's meant to be pasted into Revenge's plugin installer, not opened in a browser.</p>
                  HTML

            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./dist
                  enable_jekyll: false
